<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>About Me card</title>
  <desc>Glassy About Me card with a German intro about UI/UX, JavaScript and Design Systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1120" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="900" height="280" rx="28" fill="url(#bg)" />
  <circle cx="140" cy="70" r="90" fill="#ffffff" opacity="0.08" />
  <circle cx="760" cy="220" r="110" fill="#ffffff" opacity="0.07" />
  <rect x="60" y="45" width="780" height="190" rx="24" fill="url(#highlight)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" filter="url(#shadow)" />
  <text x="110" y="110" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600">
    About Me
  </text>
  <text x="110" y="152" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" opacity="0.92">
    👋 Hallo! Ich bin Efe und baue gerne moderne Web-Erlebnisse.
  </text>
  <text x="110" y="180" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" opacity="0.92">
    ✨ Fokus: UI/UX, JavaScript &amp; Design Systems.
  </text>
  <text x="110" y="208" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" opacity="0.92">
    📫 Lass uns vernetzen: GitHub • LinkedIn • Mail.
  </text>
</svg>
